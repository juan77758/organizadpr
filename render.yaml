# Plantilla: no crea recursos hasta que el usuario la aplique en Render.
# Prueba gratuita: backend con suspensión y PostgreSQL con caducidad.
# Correo de prueba por HTTPS con Resend; Gmail SMTP no funciona en Render Free.
services:
  - type: web
    name: organizador-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: organizador-db
          property: connectionString
      # La URL interna de Render se utiliza en la misma región y red privada.
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIME_ZONE
        value: America/Mexico_City
      # El remitente de prueba de Resend solo envía al correo de tu cuenta Resend.
      - key: EMAIL_FROM
        value: Organizador <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: organizador-db
    plan: free
    region: oregon
    databaseName: organizador
    user: organizador
    postgresMajorVersion: "16"
