services:
  database:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: organizador
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: organizador
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organizador -d organizador"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
